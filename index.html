<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prism — 音楽プレイヤー</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prism">
<meta name="theme-color" content="#0B0716">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* 表示用フォントは同梱する。外部から取りに行くと機内モードで表示が崩れるため。
   Space Grotesk / SIL Open Font License 1.1（fonts/OFL.txt） */
@font-face{
  font-family:"Space Grotesk";
  src:url("fonts/space-grotesk-latin.woff2") format("woff2");
  font-weight:400 700;
  font-style:normal;
  font-display:swap;
  unicode-range:U+0000-00FF, U+2000-206F, U+2122, U+2191, U+2193, U+2212;
}
/* ============================================================
   Prism — design tokens
   色は装飾ではなく状態を表す:
     pink   = 再生中 / いま鳴っているもの
     blue   = ライブラリ
     violet = プレイリスト
     green  = シャッフル・リピートが有効
   ============================================================ */
:root{
  --ink:      #0B0716;
  --ink-2:    #150E28;
  /* 屋外や低輝度でも境界が見える程度に上げてある */
  --surface:  rgba(255,255,255,.075);
  --surface-2:rgba(255,255,255,.135);
  --hairline: rgba(255,255,255,.145);

  --pink:   #FF4D93;
  --violet: #A66BFF;
  --blue:   #3FC9F5;
  --green:  #3DE39B;

  --text:   #F2EDFF;
  --muted:  #9C90BC;
  --danger: #FF6B6B;

  /* 指で確実に押せる最小サイズ（Apple HIGの44pt） */
  --tap: 44px;

  --display: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
          "Yu Gothic", Meiryo, sans-serif;

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 24px;

  --tab-h: 58px;
  --mini-h: 62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--ink);
  color:var(--text);
  font-family:var(--body);
  font-size:15px;
  line-height:1.5;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer;}
input{font-family:inherit;}

/* ---------- signature: aurora ----------
   再生中だけ動く。止めれば静止する。 */
#aurora{
  position:fixed; inset:-25%; z-index:0; pointer-events:none;
  filter:blur(70px); opacity:.5;
  transition:opacity .9s ease;
}
#aurora span{
  position:absolute; width:62vmax; height:62vmax; border-radius:50%;
  animation:drift 26s ease-in-out infinite alternate;
  animation-play-state:paused;
}
#aurora span:nth-child(1){background:radial-gradient(circle,var(--pink),transparent 62%);   top:-12%; left:-14%; animation-duration:24s;}
#aurora span:nth-child(2){background:radial-gradient(circle,var(--violet),transparent 62%); top:16%;  right:-22%; animation-duration:31s; animation-delay:-6s;}
#aurora span:nth-child(3){background:radial-gradient(circle,var(--blue),transparent 62%);   bottom:-16%; left:-8%; animation-duration:28s; animation-delay:-12s;}
#aurora span:nth-child(4){background:radial-gradient(circle,var(--green),transparent 62%);  bottom:2%; right:-14%; animation-duration:35s; animation-delay:-3s;}
body.playing #aurora{opacity:.78;}
body.playing #aurora span{animation-play-state:running;}
@keyframes drift{
  0%  {transform:translate3d(0,0,0) scale(1);}
  50% {transform:translate3d(9vmax,-7vmax,0) scale(1.18);}
  100%{transform:translate3d(-7vmax,8vmax,0) scale(.92);}
}

/* ---------- app shell ---------- */
#app{position:relative; z-index:1; height:100%; display:flex; flex-direction:column;}

header{
  padding:calc(var(--safe-t) + 12px) 20px 6px;
  flex:0 0 auto;
}
.eyebrow{
  font-family:var(--display); font-size:10px; font-weight:500;
  letter-spacing:.22em; text-transform:uppercase; color:var(--muted);
  display:flex; align-items:center; gap:8px;
}
.eyebrow::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--accent,var(--blue));}
h1{
  margin:1px 0 0; font-size:24px; font-weight:700; letter-spacing:-.02em;
  /* プレイリスト名が入ると長くなる。折り返して画面を圧迫させない。 */
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

main{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 20px;
     padding-bottom:calc(var(--tab-h) + var(--mini-h) + var(--safe-b) + 20px);}

/* ---------- controls row ---------- */
.toolbar{display:flex; gap:10px; margin:14px 0 8px;}
.search{
  flex:1; display:flex; align-items:center; gap:9px;
  background:var(--surface); border:1px solid var(--hairline);
  border-radius:var(--r-md); padding:0 13px; height:var(--tap);
  transition:border-color .2s, background .2s;
}
.search:focus-within{border-color:rgba(63,201,245,.55); background:rgba(63,201,245,.07);}
.search input{flex:1; background:none; border:0; outline:none; color:var(--text); font-size:16px;}
.search input::placeholder{color:var(--muted); font-size:15px;}
.icon-btn{
  width:var(--tap); height:var(--tap); flex:0 0 auto; border-radius:var(--r-md);
  background:var(--surface); border:1px solid var(--hairline);
  display:grid; place-items:center; transition:transform .15s, background .2s;
}
.icon-btn:active{transform:scale(.92);}

/* ---------- sort chips ---------- */
.chips{display:flex; gap:7px; margin:4px 0 14px; flex-wrap:wrap;}
.chip{
  font-family:var(--display); font-size:11.5px; font-weight:500; letter-spacing:.08em;
  padding:0 15px; min-height:36px; border-radius:999px;
  background:var(--surface); border:1px solid var(--hairline); color:var(--muted);
  transition:.2s;
}
.chip[aria-pressed="true"]{
  color:var(--ink); background:var(--blue); border-color:transparent; font-weight:700;
}

/* ---------- track list ---------- */
.rows{display:flex; flex-direction:column;}
.row{
  display:flex; align-items:center; gap:12px;
  padding:8px 0; border-bottom:1px solid var(--hairline);
  transition:background .18s;
}
/* 一覧を最初に開いたときだけ流し込む。
   検索の1文字ごとにこれが走ると画面がちらつくため、クラスで制御する。 */
.rows.anim .row{animation:rise .32s both;}
@keyframes rise{from{opacity:0; transform:translateY(9px);} to{opacity:1; transform:none;}}
.row:active{background:var(--surface);}

/* 曲ごとの色。--h は曲名から決まるので、同じ曲はいつも同じ色になる。 */
.thumb{
  width:44px; height:44px; border-radius:12px; flex:0 0 auto;
  position:relative; overflow:hidden; display:grid; place-items:center;
  background:linear-gradient(140deg, hsl(var(--h,270) 82% 64%), hsl(var(--h2,300) 76% 46%));
}
.thumb .ini{
  font-family:var(--display); font-weight:700; font-size:15px; color:rgba(255,255,255,.92);
  text-shadow:0 1px 6px rgba(0,0,0,.35); user-select:none;
}
.thumb .ov{
  position:absolute; inset:0; display:grid; place-items:center;
  background:rgba(6,4,12,.5); backdrop-filter:blur(1px);
}
.row .meta{flex:1; min-width:0;}
/* spanのままだと曲名とアーティストが横一列に繋がってしまう */
.row .t{display:block; font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.row .a{display:block; font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.row .d{font-family:var(--display); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;}
/* 指で押せる幅を確保しつつ、見た目は右端に寄せる。
   ここが小さいと、狙い外して行タップ＝再生になってしまう。 */
.more{
  width:var(--tap); height:var(--tap); margin-right:-10px;
  flex:0 0 auto; display:grid; place-items:center; color:var(--muted); border-radius:12px;
}
.more:active{background:var(--surface-2);}
.row.current .t{color:var(--pink);}

/* 再生中インジケータ（3本バー） */
.bars{display:flex; align-items:flex-end; gap:2px; height:15px; justify-content:center;}
.bars i{width:2.5px; background:#fff; border-radius:2px; height:35%;
        animation:eq .9s ease-in-out infinite alternate; animation-play-state:paused;}
.bars i:nth-child(2){animation-delay:-.35s; height:80%;}
.bars i:nth-child(3){animation-delay:-.6s; height:55%;}
body.playing .bars i{animation-play-state:running;}
@keyframes eq{from{height:22%;} to{height:100%;}}

/* ---------- empty state ---------- */
.empty{text-align:center; padding:56px 24px; animation:rise .4s both;}
.empty .glyph{
  width:74px; height:74px; margin:0 auto 18px; border-radius:22px;
  background:linear-gradient(140deg,var(--pink),var(--violet) 40%,var(--blue) 72%,var(--green));
  display:grid; place-items:center; box-shadow:0 12px 40px rgba(166,107,255,.3);
}
.empty h2{font-size:18px; margin:0 0 7px; font-weight:700;}
.empty p{color:var(--muted); font-size:13.5px; margin:0 auto; max-width:270px; line-height:1.7;}

/* ---------- primary button ---------- */
.cta{
  display:inline-flex; align-items:center; gap:8px; margin-top:20px;
  padding:13px 24px; border-radius:999px; font-weight:700; font-size:14.5px;
  background:linear-gradient(100deg,var(--pink),var(--violet));
  color:#fff; box-shadow:0 8px 26px rgba(255,77,147,.32);
  transition:transform .15s;
}
.cta:active{transform:scale(.95);}

/* ---------- mini player ---------- */
#mini{
  position:fixed; left:10px; right:10px;
  bottom:calc(var(--tab-h) + var(--safe-b) + 8px);
  height:var(--mini-h); z-index:20;
  background:rgba(21,14,40,.82);
  -webkit-backdrop-filter:saturate(180%) blur(22px);
  backdrop-filter:saturate(180%) blur(22px);
  border:1px solid var(--hairline); border-radius:18px;
  display:flex; align-items:center; gap:12px; padding:0 8px 0 15px;
  transform:translateY(140%); transition:transform .38s cubic-bezier(.3,1.2,.4,1);
  overflow:hidden;
}
#mini.show{transform:none;}
#mini .bar{position:absolute; left:0; bottom:0; height:2px; width:0;
  background:linear-gradient(90deg,var(--pink),var(--violet),var(--blue)); transition:width .25s linear;}
#mini .meta{flex:1; min-width:0;}
#mini .t{font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#mini .a{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#mini button{width:44px; height:44px; display:grid; place-items:center; border-radius:12px;}
#mini button:active{background:var(--surface);}

/* ---------- tab bar ---------- */
#tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:21;
  height:calc(var(--tab-h) + var(--safe-b)); padding-bottom:var(--safe-b);
  background:rgba(11,7,22,.9);
  -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px);
  border-top:1px solid var(--hairline);
  display:flex;
}
#tabs button{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--muted); font-size:10px; font-weight:600; letter-spacing:.04em;
  transition:color .2s;
}
#tabs button svg{transition:transform .2s;}
#tabs button:active svg{transform:scale(.85);}
#tabs button[aria-selected="true"]{color:var(--tab-color);}

/* ---------- now playing sheet ---------- */
#np{
  position:fixed; inset:0; z-index:40;
  background:linear-gradient(175deg,#1B1030,var(--ink) 62%);
  display:flex; flex-direction:column;
  padding:calc(var(--safe-t) + 12px) 26px calc(var(--safe-b) + 26px);
  transform:translateY(100%); transition:transform .42s cubic-bezier(.32,.9,.3,1);
  overflow:hidden;
}
#np.show{transform:none;}
#np .grab{width:38px; height:4px; border-radius:4px; background:var(--surface-2); margin:0 auto 6px;}
#np .close{
  align-self:flex-start; padding:0 14px 0 4px; min-height:var(--tap);
  display:flex; align-items:center; color:var(--muted); font-size:13px;
}

/* 曲ごとに色が変わる。同じ曲ならいつも同じ絵になる。 */
.art{
  position:relative; width:100%; aspect-ratio:1; max-height:44vh; margin:auto auto 0;
  border-radius:30px; overflow:hidden;
  background:linear-gradient(145deg,
    hsl(var(--h,270) 85% 66%), hsl(var(--h2,300) 80% 46%) 55%, hsl(var(--h3,330) 72% 26%));
  display:grid; place-items:center;
  box-shadow:0 26px 70px rgba(0,0,0,.55);
  transition:background .5s ease;
}
.art .ini{
  position:relative; font-family:var(--display); font-weight:700;
  font-size:clamp(56px, 19vw, 96px); color:rgba(255,255,255,.94);
  letter-spacing:-.03em; text-shadow:0 6px 30px rgba(0,0,0,.3); user-select:none;
}
.art::after{
  content:""; position:absolute; inset:0;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.42), transparent 55%);
  mix-blend-mode:overlay;
  animation:sheen 9s ease-in-out infinite alternate; animation-play-state:paused;
}
body.playing .art::after{animation-play-state:running;}
@keyframes sheen{from{transform:translate(-9%,-6%) scale(1);} to{transform:translate(10%,8%) scale(1.25);}}
.art svg{position:relative; opacity:.9; filter:drop-shadow(0 4px 14px rgba(0,0,0,.3));}

/* 曲名から下は画面の下端側に寄せる。親指が届く位置に操作を置くため。 */
#np .titles{margin:auto 0 0; padding-top:26px; text-align:center;}
#np .titles h2{margin:0; font-size:22px; font-weight:700; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#np .titles p{margin:5px 0 0; color:var(--muted); font-size:14px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* 次に何が鳴るのかが分からないと、シャッフル中は特に不安になる */
.upnext{
  margin-top:12px; text-align:center; font-size:12px; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:18px;
}
.upnext b{color:var(--text); font-weight:600;}

/* seek */
.seek{margin-top:16px;}
.seek input{
  -webkit-appearance:none; width:100%; height:30px; background:none; outline:none; display:block;
  touch-action:pan-x;   /* 縦に流れても再生画面が閉じないようにする */
}
.seek input::-webkit-slider-runnable-track{
  height:6px; border-radius:6px;
  background:linear-gradient(90deg,var(--pink) 0 var(--pct,0%), rgba(255,255,255,.16) var(--pct,0%) 100%);
}
.seek input::-webkit-slider-thumb{
  -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:#fff;
  margin-top:-7px; box-shadow:0 2px 10px rgba(255,77,147,.75);
  transition:transform .12s;
}
.seek.seeking input::-webkit-slider-thumb{transform:scale(1.25);}
.times{display:flex; justify-content:space-between; font-family:var(--display);
  font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; margin-top:-1px;}
/* つまんでいる間は指で隠れるので、時間を強調して読めるようにする */
.times span{display:inline-block; transition:transform .12s, color .12s;}
.seek.seeking #tCur{color:var(--pink); font-weight:700; transform:scale(1.3); transform-origin:left center;}

/* transport */
.transport{display:flex; align-items:center; justify-content:space-between; margin:22px 0 10px;}
.transport button{width:54px; height:54px; display:grid; place-items:center; border-radius:50%; transition:transform .14s;}
.transport button:active{transform:scale(.88);}
.play-btn{
  width:74px !important; height:74px !important;
  background:linear-gradient(135deg,var(--pink),var(--violet));
  box-shadow:0 10px 32px rgba(255,77,147,.42);
}
.mode-btn[aria-pressed="true"]{color:var(--green);}
.mode-btn[aria-pressed="true"]::after{
  content:""; position:absolute; width:4px; height:4px; border-radius:50%;
  background:var(--green); margin-top:30px;
}
.mode-btn{position:relative; color:var(--muted);}
.mode-btn .badge{
  position:absolute; top:9px; right:9px; font-family:var(--display);
  font-size:9px; font-weight:700; color:var(--green);
}

/* ---------- playlists ---------- */
.pl-card{
  display:flex; align-items:center; gap:14px; padding:14px;
  background:var(--surface); border:1px solid var(--hairline);
  border-radius:var(--r-md); margin-bottom:10px;
  animation:rise .3s both; transition:background .2s;
}
.pl-card:active{background:var(--surface-2);}
.pl-card .cover{
  width:50px; height:50px; border-radius:13px; flex:0 0 auto; display:grid; place-items:center;
  background:linear-gradient(140deg,var(--violet),var(--blue));
}
.pl-card .meta{flex:1; min-width:0;}
.pl-card .t{display:block; font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pl-card .a{display:block; font-size:12px; color:var(--muted);}

/* ---------- settings ---------- */
.card{
  background:var(--surface); border:1px solid var(--hairline);
  border-radius:var(--r-md); padding:16px; margin-bottom:12px;
  animation:rise .3s both;
}
.card h3{margin:0 0 10px; font-size:13px; font-weight:700; letter-spacing:.02em;}
.card p{margin:0; color:var(--muted); font-size:12.5px; line-height:1.75;}
.gauge{height:8px; border-radius:8px; background:rgba(255,255,255,.1); overflow:hidden; margin:12px 0 8px;}
.gauge i{display:block; height:100%; border-radius:8px;
  background:linear-gradient(90deg,var(--green),var(--blue),var(--violet)); transition:width .6s;}
.stat{display:flex; justify-content:space-between; font-family:var(--display);
  font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;}
.stat b{color:var(--text); font-weight:700;}
.linkbtn{
  display:block; width:100%; text-align:left; padding:14px 16px; margin-bottom:10px;
  background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-md);
  font-size:14px; font-weight:500; transition:background .2s;
}
.linkbtn:active{background:var(--surface-2);}
.linkbtn.danger{color:var(--danger);}

/* ---------- sheet (action / prompt) ---------- */
#scrim{position:fixed; inset:0; z-index:50; background:rgba(5,3,12,.6);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  opacity:0; pointer-events:none; transition:opacity .28s;}
#scrim.show{opacity:1; pointer-events:auto;}
#sheet{
  position:fixed; left:8px; right:8px; bottom:0; z-index:51;
  background:#1A1130; border:1px solid var(--hairline);
  border-radius:24px 24px 0 0; padding:10px 10px calc(var(--safe-b) + 14px);
  transform:translateY(110%); transition:transform .34s cubic-bezier(.3,1.05,.4,1);
  max-height:80vh; overflow-y:auto;
}
#sheet.show{transform:none;}
#sheet .grab{width:38px; height:4px; border-radius:4px; background:var(--surface-2); margin:4px auto 12px;}
#sheet h3{margin:0 0 4px; padding:0 12px; font-size:16px;}
#sheet .sub{margin:0 0 12px; padding:0 12px; color:var(--muted); font-size:12.5px;}
.sheet-item{
  display:flex; align-items:center; gap:12px; width:100%;
  padding:14px 14px; border-radius:14px; font-size:15px; text-align:left;
  transition:background .18s;
}
.sheet-item:active{background:var(--surface);}
.sheet-item.danger{color:var(--danger);}
.field{
  width:100%; height:48px; padding:0 14px; margin:0 0 10px;
  background:var(--surface); border:1px solid var(--hairline); border-radius:14px;
  /* 16px未満だとiOSがフォーカス時に勝手にズームする */
  color:var(--text); font-size:16px; outline:none;
}
.field:focus{border-color:rgba(166,107,255,.6);}

/* ---------- toast ---------- */
#toast{
  position:fixed; left:50%; bottom:calc(var(--tab-h) + var(--safe-b) + 22px);
  transform:translate(-50%,16px); z-index:60;
  background:rgba(26,17,48,.96); border:1px solid var(--hairline);
  padding:11px 18px; border-radius:999px; font-size:13px; font-weight:500;
  opacity:0; pointer-events:none; transition:opacity .25s, transform .25s, bottom .3s;
  max-width:88vw; text-align:center;
  display:flex; align-items:center; justify-content:center; gap:16px;
}
/* ミニプレイヤーが出ているときはその上に逃がす */
#mini.show ~ #toast{bottom:calc(var(--tab-h) + var(--mini-h) + var(--safe-b) + 26px);}
#toast.show{opacity:1; transform:translate(-50%,0);}
#toast.actionable{pointer-events:auto;}
#toast .undo{
  color:var(--blue); font-weight:700; font-size:13.5px; white-space:nowrap;
  padding:8px 2px; margin:-8px 0;
}

/* ---------- progress overlay ---------- */
#busy{
  position:fixed; inset:0; z-index:70; display:none;
  place-items:center; background:rgba(11,7,22,.86);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
}
#busy.show{display:grid;}
#busy .ring{
  width:56px; height:56px; border-radius:50%;
  border:3px solid rgba(255,255,255,.12); border-top-color:var(--pink);
  animation:spin .8s linear infinite; margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg);}}
#busy .txt{text-align:center; font-size:14px; font-weight:600;}
#busy .sub{text-align:center; font-size:12px; color:var(--muted); margin-top:5px;}
#busyCancel{
  display:block; margin:20px auto 0; min-height:var(--tap); padding:0 22px;
  border-radius:999px; background:var(--surface); border:1px solid var(--hairline);
  color:var(--text); font-size:14px; font-weight:600;
}
#busyCancel:active{background:var(--surface-2);}

.hidden{display:none !important;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important; transition-duration:.05s !important;}
}
</style>
</head>

<input type="file" id="filePicker" accept="audio/mpeg,audio/mp3,.mp3" multiple class="hidden">
<audio id="audio" preload="metadata"></audio>

<script>
"use strict";

/* ============================================================
   1. データ層 — IndexedDB
   ============================================================ */
const DB_NAME = "prism-music", DB_VER = 1;
let db;

function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains("tracks"))    d.createObjectStore("tracks", {keyPath:"id"});
      if(!d.objectStoreNames.contains("playlists")) d.createObjectStore("playlists", {keyPath:"id"});
      if(!d.objectStoreNames.contains("settings"))  d.createObjectStore("settings", {keyPath:"key"});
    };
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
const tx = (store, mode) => db.transaction(store, mode).objectStore(store);
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

const dbAll = s      => req(tx(s, "readonly").getAll());
const dbGet = (s, k) => req(tx(s, "readonly").get(k));
const dbPut = (s, v) => req(tx(s, "readwrite").put(v));
const dbDel = (s, k) => req(tx(s, "readwrite").delete(k));

/* ============================================================
   2. 状態
   ============================================================ */
const S = {
  tracks: [],          // メタデータのみ（Blobは都度読む）
  playlists: [],
  view: "library",
  activePlaylistId: null,
  query: "",
  sort: "addedAt",
  queue: [],           // 再生対象のtrack idの配列
  order: [],           // queueに対する再生順（シャッフル時は並び替え済み）
  pos: -1,             // orderの位置
  currentId: null,
  source: {type:"library"},  // 再生元。再起動後もこの並びに戻す
  repeat: "off",       // off | one | all
  shuffle: false,
  objectUrl: null,
  importError: null,   // 取り込みが容量で止まったときの記録（設定画面に出す）
  persisted: false,    // 保存領域を消されにくくできたか（iOSは不可）
  ctxOpen: false
};

const audio = document.getElementById("audio");
const $ = id => document.getElementById(id);

/* ============================================================
   3. ユーティリティ
   ============================================================ */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function fmtTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}
function fmtBytes(b){
  if(b < 1024) return b + " B";
  if(b < 1048576) return (b / 1024).toFixed(0) + " KB";
  if(b < 1073741824) return (b / 1048576).toFixed(1) + " MB";
  return (b / 1073741824).toFixed(2) + " GB";
}
function fmtDate(ms){
  const d = new Date(ms);
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
let toastTimer;
/* action を渡すと「元に戻す」ボタン付きになり、表示時間も長くなる */
function toast(msg, action){
  const t = $("toast");
  t.innerHTML = "";
  const label = document.createElement("span");
  label.textContent = msg;
  t.appendChild(label);

  t.classList.toggle("actionable", !!action);
  if(action){
    const b = document.createElement("button");
    b.className = "undo";
    b.textContent = action.label;
    b.addEventListener("click", () => { hideToast(); action.run(); });
    t.appendChild(b);
  }
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, action ? 7000 : 2200);
}
function hideToast(){
  $("toast").classList.remove("show", "actionable");
}

let busyCancel = null;
function busy(on, txt, sub, onCancel){
  $("busy").classList.toggle("show", on);
  if(txt !== undefined) $("busyTxt").textContent = txt;
  $("busySub").textContent = sub || "";
  busyCancel = on ? (onCancel || null) : null;
  $("busyCancel").classList.toggle("hidden", !busyCancel);
}

/* ============================================================
   3-b. 曲ごとの色
   曲名とアーティストから色を決める。ランダムではないので、
   同じ曲は一覧でも再生画面でもロック画面でも必ず同じ色になる。
   ============================================================ */
function hashStr(s){
  let h = 2166136261;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function hueOf(t){
  return hashStr((t.title || "") + "|" + (t.artist || "")) % 360;
}
function artVars(t){
  const h = hueOf(t);
  return `--h:${h}; --h2:${(h + 38) % 360}; --h3:${(h + 76) % 360};`;
}
function initialOf(t){
  const s = (t.title || "").trim();
  return s ? Array.from(s)[0].toUpperCase() : "♪";
}

/* ロック画面に出すジャケットをその場で描く。曲数が増えても
   持ち続けないよう、直近ぶんだけ覚えておく。 */
const artCache = new Map();
function artworkURL(t, size){
  const key = t.id + "@" + size;
  if(artCache.has(key)) return artCache.get(key);
  let url = null;
  try{
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const g = c.getContext("2d");
    const h = hueOf(t);
    const grad = g.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0,   `hsl(${h} 85% 66%)`);
    grad.addColorStop(.55, `hsl(${(h + 38) % 360} 80% 46%)`);
    grad.addColorStop(1,   `hsl(${(h + 76) % 360} 72% 26%)`);
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    g.fillStyle = "rgba(255,255,255,.94)";
    g.font = `700 ${Math.round(size * .4)}px "Space Grotesk", -apple-system, sans-serif`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(initialOf(t), size / 2, size / 2 + size * .02);
    url = c.toDataURL("image/png");
  }catch(e){ return null; }

  if(artCache.size > 24) artCache.clear();
  artCache.set(key, url);
  return url;
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ファイル名から曲名・アーティストを推定 */
function parseName(fileName){
  let n = fileName.replace(/\.(mp3|MP3)$/, "").trim();
  n = n.replace(/^\d{1,3}[\s._-]+/, "");           // 先頭のトラック番号を除去
  const m = n.match(/^(.+?)\s*[-–—]\s*(.+)$/);      // 「アーティスト - 曲名」
  if(m) return { artist: m[1].trim(), title: m[2].trim() };
  return { artist: "不明なアーティスト", title: n };
}

/* Blobから再生時間を取得 */
function readDuration(blob){
  return new Promise(res => {
    const url = URL.createObjectURL(blob);
    const a = new Audio();
    const done = d => { URL.revokeObjectURL(url); res(d); };
    a.addEventListener("loadedmetadata", () => done(isFinite(a.duration) ? a.duration : 0));
    a.addEventListener("error", () => done(0));
    // 取れないファイルで待ち続けない。長さは再生時にも補正される。
    setTimeout(() => done(isFinite(a.duration) ? a.duration : 0), 3000);
    a.src = url;
  });
}

/* ============================================================
   4. 設定の保存・復元
   ============================================================ */
async function saveSettings(extra){
  const v = Object.assign({
    key: "app",
    repeat: S.repeat,
    shuffle: S.shuffle,
    sort: S.sort,
    source: S.source,
    importError: S.importError,
    lastTrackId: S.currentId,
    lastPos: audio.currentTime || 0
  }, extra || {});
  try { await dbPut("settings", v); } catch(e){}
}
let saveTimer;
const saveSoon = () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveSettings, 1200); };

/* ============================================================
   5. 取り込み
   ============================================================ */
/* 1曲ずつ順番に処理すると、長さの読み取り待ちで100曲が何分もかかる。
   数曲を同時に流しつつ、addedAtで元の並び順は保つ。 */
const IMPORT_CONC = 4;

async function importFiles(fileList){
  const files = Array.from(fileList).filter(f => /mp3|mpeg/i.test(f.type) || /\.mp3$/i.test(f.name));
  if(!files.length){ toast("mp3ファイルが見つかりません"); return; }

  const existing = new Set(S.tracks.map(t => t.fileName + "|" + t.fileSize));
  const base = Date.now();
  let done = 0, added = 0, skipped = 0, stopped = false, failed = null;

  const tick = () => { $("busySub").textContent = (++done) + " / " + files.length; };
  busy(true, "取り込んでいます", "0 / " + files.length, () => { stopped = true; });

  let cursor = 0;
  async function worker(){
    while(cursor < files.length && !stopped){
      const i = cursor++;
      const f = files[i];
      const key = f.name + "|" + f.size;
      if(existing.has(key)){ skipped++; tick(); continue; }
      existing.add(key);

      try{
        const dur = await readDuration(f);
        if(stopped) return;
        const p = parseName(f.name);
        const rec = {
          id: uid(), title: p.title, artist: p.artist, album: "",
          duration: dur, fileName: f.name, fileSize: f.size,
          blob: f, addedAt: base + i    // 選んだ順を保つ
        };
        await dbPut("tracks", rec);
        const { blob, ...meta } = rec;
        S.tracks.push(meta);
        added++;
      }catch(err){
        // ほぼ確実に保存容量の上限。何MBで止まったかは記録に残す。
        console.error("import failed", f.name, err);
        failed = { fileName: f.name };
        stopped = true;
        return;
      }
      tick();
    }
  }
  await Promise.all(Array.from({length: Math.min(IMPORT_CONC, files.length)}, worker));
  busy(false);
  render();

  if(failed){
    S.importError = {
      at: Date.now(),
      fileName: failed.fileName,
      addedThisTime: added,
      bytesAtFailure: S.tracks.reduce((s, t) => s + (t.fileSize || 0), 0),
      tracksAtFailure: S.tracks.length
    };
    await saveSettings();
    showImportError();
    return;
  }

  toast(stopped
    ? added + "曲を追加して中止しました"
    : added + "曲を追加" + (skipped ? "・" + skipped + "曲は重複でスキップ" : ""));
}

function showImportError(){
  const e = S.importError;
  if(!e) return;
  openSheet(`
    <h3>これ以上保存できませんでした</h3>
    <p class="sub">この端末に入る上限に達した可能性があります。下の数字は設定画面にも残してあります。</p>
    <div style="padding:4px 12px 10px">
      <div class="stat"><span>入っている曲数</span><b>${e.tracksAtFailure}</b></div>
      <div class="stat"><span>入っているデータ量</span><b>${fmtBytes(e.bytesAtFailure)}</b></div>
      <div class="stat"><span>今回追加できた曲</span><b>${e.addedThisTime}</b></div>
      <p class="sub" style="padding:0; margin:8px 0 0">止まったファイル：${esc(e.fileName)}</p>
    </div>
    <button class="sheet-item" id="impOk">閉じる</button>`);
  $("impOk").addEventListener("click", closeSheet);
}

/* ============================================================
   6. 再生エンジン
   ============================================================ */
function trackById(id){ return S.tracks.find(t => t.id === id); }

function buildOrder(startId, avoidFirstId){
  const n = S.queue.length;
  let arr = Array.from({length:n}, (_, i) => i);
  if(S.shuffle){
    for(let i = n - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    // 選んだ曲を先頭へ
    if(startId){
      const qi = S.queue.indexOf(startId);
      const oi = arr.indexOf(qi);
      if(oi > 0){ arr.splice(oi, 1); arr.unshift(qi); }
    }else if(avoidFirstId != null && n > 1 && S.queue[arr[0]] === avoidFirstId){
      // 一巡して並べ直した直後に、いま鳴っていた曲がまた先頭に来ないようにする
      [arr[0], arr[1]] = [arr[1], arr[0]];
    }
  }
  S.order = arr;
  S.pos = startId ? S.order.indexOf(S.queue.indexOf(startId)) : 0;
  if(S.pos < 0) S.pos = 0;
}

async function playQueue(ids, startId, source){
  if(!ids.length) return;
  S.queue = ids.slice();
  if(source) S.source = source;
  buildOrder(startId || ids[0]);
  await loadCurrent(true);
}

/* 次に鳴る曲を先に読み出しておく。曲が変わるたびに
   IndexedDBから数MB取り出していると、曲間に無音の間ができるため。 */
let prefetched = { id: null, blob: null };
function prefetchNext(){
  let id = null;
  const nx = S.pos + 1;
  if(nx < S.order.length) id = S.queue[S.order[nx]];
  else if(S.repeat === "all" && S.order.length) id = S.queue[S.order[0]];

  if(!id || id === S.currentId || id === prefetched.id) return;
  dbGet("tracks", id)
    .then(rec => { if(rec && rec.blob) prefetched = { id, blob: rec.blob }; })
    .catch(() => {});
}

async function loadCurrent(autoplay, seekTo){
  const qi = S.order[S.pos];
  const id = S.queue[qi];
  if(!id) return;
  const meta = trackById(id);
  if(!meta) return;

  let blob = null;
  if(prefetched.id === id && prefetched.blob){
    blob = prefetched.blob;
  }else{
    try{ const rec = await dbGet("tracks", id); blob = rec && rec.blob; }catch(e){}
  }
  if(!blob){ toast("ファイルを読み込めません"); return; }
  prefetched = { id: null, blob: null };

  if(S.objectUrl) URL.revokeObjectURL(S.objectUrl);
  S.objectUrl = URL.createObjectURL(blob);
  S.currentId = id;
  audio.src = S.objectUrl;

  if(seekTo){
    audio.addEventListener("loadedmetadata", () => { try{ audio.currentTime = seekTo; }catch(e){} }, {once:true});
  }
  updateNowPlaying(meta);
  $("mini").classList.add("show");
  renderList();

  if(autoplay){
    try{ await audio.play(); }
    catch(e){ setPlayingUI(false); }
  }
  saveSettings();
  setTimeout(prefetchNext, 500);
}

function nextTrack(manual){
  if(!S.queue.length) return;
  if(!manual && S.repeat === "one"){
    audio.currentTime = 0; audio.play().catch(()=>{});
    return;
  }
  if(S.pos < S.order.length - 1){
    S.pos++;
    loadCurrent(true);
  }else if(S.repeat === "all" || (manual && S.queue.length > 1)){
    if(S.shuffle) buildOrder(null, S.currentId);   // 一巡したら並べ直す
    S.pos = 0;
    loadCurrent(true);
  }else{
    audio.pause();
    audio.currentTime = 0;
    setPlayingUI(false);
  }
}

function prevTrack(){
  if(audio.currentTime > 3){ audio.currentTime = 0; return; }
  if(S.pos > 0){ S.pos--; loadCurrent(true); }
  else{ audio.currentTime = 0; }
}

function togglePlay(){
  if(!S.currentId){
    const ids = libraryQueue().map(t => t.id);
    if(ids.length) playQueue(ids, ids[0], {type:"library"});
    return;
  }
  if(audio.paused) audio.play().catch(() => toast("再生できませんでした"));
  else audio.pause();
}

/* ============================================================
   7. Media Session（ロック画面・コントロールセンター）
   ============================================================ */
function updateNowPlaying(meta){
  $("miniTitle").textContent = meta.title;
  $("miniArtist").textContent = meta.artist;
  $("npTitle").textContent = meta.title;
  $("npArtist").textContent = meta.artist;
  $("tTot").textContent = fmtTime(meta.duration);

  // 再生画面の色とイニシャルを、いま鳴っている曲に合わせる
  $("npArt").setAttribute("style", artVars(meta));
  $("npIni").textContent = initialOf(meta);

  if("mediaSession" in navigator){
    const art = [];
    const a512 = artworkURL(meta, 512), a192 = artworkURL(meta, 192);
    if(a512) art.push({ src: a512, sizes: "512x512", type: "image/png" });
    if(a192) art.push({ src: a192, sizes: "192x192", type: "image/png" });
    art.push({ src: "icons/icon-512.png", sizes: "512x512", type: "image/png" });  // 生成できない端末向け
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title: meta.title,
        artist: meta.artist,
        album: meta.album || "Prism",
        artwork: art
      });
    }catch(e){}
  }
  updatePositionState();
  updateUpNext();
}

/* 次に何が鳴るのかを出しておく。シャッフル中は特に、
   これがないと次が予測できず落ち着かない。 */
function updateUpNext(){
  const el = $("upNext");
  if(!el) return;
  if(!S.currentId){ el.textContent = ""; return; }

  let id = null, prefix = "次に流れる曲：";
  if(S.repeat === "one"){
    id = S.currentId;
    prefix = "この曲をリピート中：";
  }else{
    const nx = S.pos + 1;
    if(nx < S.order.length) id = S.queue[S.order[nx]];
    else if(S.repeat === "all" && S.order.length) id = S.queue[S.order[0]];
  }
  const t = id ? trackById(id) : null;
  if(!t){ el.textContent = "この曲でおわり"; return; }
  el.innerHTML = prefix + "<b>" + esc(t.title) + "</b>";
}

/* ロック画面・コントロールセンターに再生位置を知らせる。
   これを送らないと、あちら側のシークバーが出ない、あるいは動かない。 */
function updatePositionState(){
  if(!("mediaSession" in navigator) || !navigator.mediaSession.setPositionState) return;
  const d = audio.duration;
  if(!isFinite(d) || d <= 0) return;
  try{
    navigator.mediaSession.setPositionState({
      duration: d,
      playbackRate: audio.playbackRate || 1,
      position: Math.min(Math.max(audio.currentTime || 0, 0), d)
    });
  }catch(e){}
}

if("mediaSession" in navigator){
  const set = (a, fn) => { try{ navigator.mediaSession.setActionHandler(a, fn); }catch(e){} };
  set("play",          () => audio.play().catch(()=>{}));
  set("pause",         () => audio.pause());
  set("previoustrack", () => prevTrack());
  set("nexttrack",     () => nextTrack(true));
  set("seekto",        d => { if(d.seekTime != null) audio.currentTime = d.seekTime; });
  set("seekbackward",  d => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); });
  set("seekforward",   d => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (d.seekOffset || 10)); });
}

/* ============================================================
   8. 再生イベント
   ============================================================ */
const ICON_PLAY  = '<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
const ICON_PAUSE = '<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';
const ICON_PLAY_S  = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
const ICON_PAUSE_S = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';
const ICON_NEXT_S  = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 6H18v12h-2.5zM4 6v12l10.5-6z"/></svg>';

$("miniNext").innerHTML = ICON_NEXT_S;

function setPlayingUI(on){
  document.body.classList.toggle("playing", on);
  $("btnPlay").innerHTML  = on ? ICON_PAUSE : ICON_PLAY;
  $("miniPlay").innerHTML = on ? ICON_PAUSE_S : ICON_PLAY_S;
  $("btnPlay").setAttribute("aria-label", on ? "一時停止" : "再生");
  if("mediaSession" in navigator){
    try{ navigator.mediaSession.playbackState = on ? "playing" : "paused"; }catch(e){}
  }
}
setPlayingUI(false);

audio.addEventListener("play",  () => { setPlayingUI(true); updatePositionState(); });
audio.addEventListener("pause", () => { setPlayingUI(false); updatePositionState(); saveSettings(); });
audio.addEventListener("ended", () => nextTrack(false));
audio.addEventListener("error", () => { if(audio.src) toast("この曲を再生できません"); });

let seeking = false, lastPosSync = 0;
audio.addEventListener("timeupdate", () => {
  const d = audio.duration || 0;
  const pct = d ? (audio.currentTime / d) * 100 : 0;
  $("miniBar").style.width = pct + "%";
  if(!seeking){
    $("seek").value = Math.round(pct * 10);
    $("seek").style.setProperty("--pct", pct + "%");
  }
  $("tCur").textContent = fmtTime(audio.currentTime);
  // ロック画面への位置通知は1秒に1回で足りる
  const now = Date.now();
  if(now - lastPosSync > 1000){ lastPosSync = now; updatePositionState(); }
  saveSoon();
});
audio.addEventListener("loadedmetadata", () => {
  $("tTot").textContent = fmtTime(audio.duration);
  updatePositionState();
  // 取り込み時に長さが取れていなければここで補正
  const t = trackById(S.currentId);
  if(t && (!t.duration || t.duration < 1) && isFinite(audio.duration)){
    t.duration = audio.duration;
    dbGet("tracks", t.id).then(rec => { if(rec){ rec.duration = audio.duration; dbPut("tracks", rec); }});
    renderList();
  }
});

$("seek").addEventListener("input", e => {
  seeking = true;
  $("seekWrap").classList.add("seeking");
  const pct = e.target.value / 10;
  e.target.style.setProperty("--pct", pct + "%");
  $("tCur").textContent = fmtTime((audio.duration || 0) * pct / 100);
});
$("seek").addEventListener("change", e => {
  const d = audio.duration || 0;
  if(d) audio.currentTime = d * (e.target.value / 1000);
  seeking = false;
  $("seekWrap").classList.remove("seeking");
  updatePositionState();
});

/* ============================================================
   9. ビュー描画
   ============================================================ */
function sortTracks(list){
  const by = S.sort;
  return list.sort((a, b) => {
    if(by === "addedAt") return b.addedAt - a.addedAt;
    if(by === "artist")  return a.artist.localeCompare(b.artist, "ja") || a.title.localeCompare(b.title, "ja");
    return a.title.localeCompare(b.title, "ja");
  });
}

/* 画面に出す一覧。検索の絞り込みが効く。 */
function visibleTracks(){
  let list = S.tracks.slice();
  const q = S.query.trim().toLowerCase();
  if(q) list = list.filter(t => (t.title + " " + t.artist).toLowerCase().includes(q));
  return sortTracks(list);
}

/* 再生する対象の一覧。検索で1曲に絞り込んでいても、鳴らすのは
   ライブラリ全体にする。そうしないと、その1曲で再生が終わってしまう。 */
function libraryQueue(){
  return sortTracks(S.tracks.slice());
}

/* 前回どこから再生していたか（ライブラリか、どのプレイリストか）をもとに
   キューを組み直す。これがないと、再起動後に必ずライブラリ全曲に化ける。 */
function queueFromSource(src, needId){
  if(src && src.type === "playlist"){
    const pl = S.playlists.find(p => p.id === src.id);
    if(pl){
      const ids = pl.trackIds.filter(trackById);
      if(ids.length && (!needId || ids.includes(needId))) return ids;
    }
  }
  S.source = {type:"library"};
  return libraryQueue().map(t => t.id);
}

const SVG_NOTE = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
const SVG_DOTS = '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>';

const BARS = '<span class="ov"><span class="bars"><i></i><i></i><i></i></span></span>';

function rowHTML(t, i){

  return `<div class="row ${cur ? "current" : ""}" data-id="${t.id}"

  </div>`;
}

function render(){
  const v = S.view;
  const tabColors = { library: "var(--blue)", playlists: "var(--violet)", settings: "var(--green)" };
  document.documentElement.style.setProperty("--accent", tabColors[v] || "var(--blue)");
  document.querySelectorAll("#tabs button").forEach(b =>
    b.setAttribute("aria-selected", b.dataset.view === v ? "true" : "false"));

  if(v === "library")   renderLibrary();
  if(v === "playlists") S.activePlaylistId ? renderPlaylistDetail() : renderPlaylists();
  if(v === "settings")  renderSettings();
}

function renderLibrary(){

/* 検索結果だけを描き直す。検索欄は作り直さないのでフォーカスが飛ばない。
   animate は一覧を開いた最初の1回だけ。1文字打つたびに全行が
   アニメーションし直すと、画面がちらついて読めなくなる。 */
function renderResults(animate){
  const box = $("results");
  if(!box) return;
  const list = visibleTracks();

  if(!S.tracks.length){
    box.innerHTML = `
      <div class="empty">
        <div class="glyph">${SVG_NOTE}</div>
        <h2>まだ1曲も入っていません</h2>
        <p>右上の＋から、iPhoneの「ファイル」アプリに置いたmp3を選んで追加します。</p>
        <button class="cta" id="btnAdd2">＋ 曲を追加する</button>
      </div>`;
    $("btnAdd2").addEventListener("click", () => $("filePicker").click());
  }else if(!list.length){
    box.innerHTML = `<div class="empty"><h2>見つかりません</h2><p>「${esc(S.query)}」に一致する曲はありません。別の言葉で探してみてください。</p></div>`;
  }else{
    box.innerHTML = `<div class="rows${animate ? " anim" : ""}" id="rows">${list.map(rowHTML).join("")}</div>`;
  }
}

function renderList(){
  // 再生中インジケータだけ差し替える（入力欄を壊さないため）
  const rows = $("rows");
  if(!rows) return;
  rows.querySelectorAll(".row").forEach(el => {
    const cur = el.dataset.id === S.currentId;
    el.classList.toggle("current", cur);
    const thumb = el.querySelector(".thumb");
    if(!thumb) return;
    const ov = thumb.querySelector(".ov");
    if(cur && !ov) thumb.insertAdjacentHTML("beforeend", BARS);
    else if(!cur && ov) ov.remove();
  });
}

function bindLibrary(){
  const q = $("q");
  if(q){
    q.addEventListener("input", e => { S.query = e.target.value; renderResults(); });
    // 「検索」キーでキーボードを閉じる。出しっぱなしだと一覧が半分隠れる。
    q.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); q.blur(); } });
  }

  document.querySelectorAll("[data-sort]").forEach(b =>
    b.addEventListener("click", () => {
      S.sort = b.dataset.sort;
      document.querySelectorAll("[data-sort]").forEach(x =>
        x.setAttribute("aria-pressed", x.dataset.sort === S.sort));
      saveSettings();
      renderResults();
    }));

  $("btnAdd") && $("btnAdd").addEventListener("click", () => $("filePicker").click());
}

/* 行のタップ（委譲） */
$("main").addEventListener("click", e => {
  const more = e.target.closest("[data-more]");
  if(more){ e.stopPropagation(); openTrackMenu(more.dataset.more); return; }
  const row = e.target.closest(".row");
  if(row){
    if(S.view === "playlists" && S.activePlaylistId){
      const pl = S.playlists.find(p => p.id === S.activePlaylistId);
      playQueue(pl.trackIds.filter(trackById), row.dataset.id, {type:"playlist", id:pl.id});
    }else{
      // 検索中でも、続けて鳴らす対象はライブラリ全体
      playQueue(libraryQueue().map(t => t.id), row.dataset.id, {type:"library"});
    }
    return;
  }
  const card = e.target.closest("[data-pl]");
  if(card){ S.activePlaylistId = card.dataset.pl; render(); }
});

/* 曲の行はキーボード（外付けやVoiceOver）からも押せるようにする */
$("main").addEventListener("keydown", e => {
  if(e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest(".row");
  if(row && !e.target.closest("[data-more]")){ e.preventDefault(); row.click(); }
});

function renderPlaylistDetail(){

  if(!pl){ S.activePlaylistId = null; return renderPlaylists(); }
  const items = pl.trackIds.map(trackById).filter(Boolean);

function promptNewPlaylist(){
  openSheet(`
    <h3>新しいプレイリスト</h3>
    <p class="sub">あとから名前は変えられます。</p>
    <div style="padding:0 12px">
      <input class="field" id="plName" placeholder="例：作業用" maxlength="40">

    </div>`);
  setTimeout(() => $("plName") && $("plName").focus(), 260);
  $("plCreate").addEventListener("click", async () => {
    const name = ($("plName").value || "").trim() || "新しいプレイリスト";
    const p = { id: uid(), name, trackIds: [], createdAt: Date.now(), updatedAt: Date.now() };
    await dbPut("playlists", p);
    S.playlists.push(p);

function openPlaylistMenu(id){
  const pl = S.playlists.find(p => p.id === id);
  if(!pl) return;
  openSheet(`
    <h3>${esc(pl.name)}</h3>
    <p class="sub">${pl.trackIds.filter(trackById).length}曲</p>
    <button class="sheet-item" id="plRename">名前を変更</button>
    <button class="sheet-item danger" id="plDelete">プレイリストを削除</button>`);
  $("plRename").addEventListener("click", () => {
    openSheet(`
      <h3>名前を変更</h3>
      <div style="padding:0 12px">
        <input class="field" id="plName2" value="${esc(pl.name)}" maxlength="40">
        <button class="cta" id="plSave" style="width:100%;justify-content:center">保存</button>
      </div>`);
    $("plSave").addEventListener("click", async () => {
      pl.name = ($("plName2").value || "").trim() || pl.name;
      pl.updatedAt = Date.now();
      await dbPut("playlists", pl);
      closeSheet(); render(); toast("名前を変更しました");
    });
  });
  $("plDelete").addEventListener("click", () => {
    openSheet(`
      <h3>プレイリストを削除しますか？</h3>
      <p class="sub">「${esc(pl.name)}」の並びが消えます。曲そのものはライブラリに残ります。</p>
      <button class="sheet-item danger" id="plDelYes">削除する</button>
      <button class="sheet-item" id="plDelNo">やめる</button>`);
    $("plDelNo").addEventListener("click", closeSheet);
    $("plDelYes").addEventListener("click", async () => {
      const backup = Object.assign({}, pl, { trackIds: pl.trackIds.slice() });
      await dbDel("playlists", id);
      S.playlists = S.playlists.filter(p => p.id !== id);
      if(S.activePlaylistId === id) S.activePlaylistId = null;
      closeSheet(); render();
      toast("「" + backup.name + "」を削除しました", {
        label: "元に戻す",
        run: async () => {
          try{
            await dbPut("playlists", backup);
            S.playlists.push(backup);
            render();
            toast("元に戻しました");
          }catch(e){ toast("戻せませんでした"); }
        }
      });
    });
  });
}

/* ---------- 曲のメニュー ---------- */
function openTrackMenu(id){
  const t = trackById(id);

    closeSheet();

    }else{
      playQueue(libraryQueue().map(x => x.id), id, {type:"library"});
    }
  });

  $("mAdd").addEventListener("click", () => {
    if(!S.playlists.length){ closeSheet(); toast("先にプレイリストを作ってください"); return; }
    openSheet(`<h3>追加先を選ぶ</h3><p class="sub">${esc(t.title)}</p>` +
      S.playlists.map(p => `<button class="sheet-item" data-target="${p.id}">${esc(p.name)}</button>`).join(""));
    document.querySelectorAll("[data-target]").forEach(b =>
      b.addEventListener("click", async () => {
        const pl = S.playlists.find(p => p.id === b.dataset.target);
        if(pl.trackIds.includes(id)){ closeSheet(); toast("すでに追加されています"); return; }
        pl.trackIds.push(id); pl.updatedAt = Date.now();
        await dbPut("playlists", pl);
        closeSheet(); render(); toast("「" + pl.name + "」に追加しました");
      }));
  });

  if(inDetail){
    $("mRemove").addEventListener("click", async () => {
      const pl = S.playlists.find(p => p.id === S.activePlaylistId);
      pl.trackIds = pl.trackIds.filter(x => x !== id);
      await dbPut("playlists", pl);
      closeSheet(); render(); toast("プレイリストから外しました");
    });
  }

  $("mEdit").addEventListener("click", () => {
    openSheet(`
      <h3>曲の情報を編集</h3>
      <div style="padding:0 12px">
        <input class="field" id="eT" value="${esc(t.title)}" placeholder="曲名" maxlength="80">
        <input class="field" id="eA" value="${esc(t.artist)}" placeholder="アーティスト" maxlength="80">
        <button class="cta" id="eSave" style="width:100%;justify-content:center">保存</button>
      </div>`);
    $("eSave").addEventListener("click", async () => {
      const rec = await dbGet("tracks", id);
      if(rec){
        rec.title  = ($("eT").value || "").trim() || rec.title;
        rec.artist = ($("eA").value || "").trim() || rec.artist;
        await dbPut("tracks", rec);
        t.title = rec.title; t.artist = rec.artist;
        if(S.currentId === id) updateNowPlaying(t);
      }
      closeSheet(); render(); toast("保存しました");
    });
  });

  $("mDel").addEventListener("click", () => {
    openSheet(`
      <h3>この曲を削除しますか？</h3>
      <p class="sub">${esc(t.title)}／${esc(t.artist)}</p>
      <p class="sub">端末の中の音源も消えます。もう一度聴くには、iPhoneに入れ直して取り込み直すことになります。</p>
      <button class="sheet-item danger" id="delYes">削除する</button>
      <button class="sheet-item" id="delNo">やめる</button>`);
    $("delNo").addEventListener("click", closeSheet);
    $("delYes").addEventListener("click", () => { closeSheet(); deleteTrack(id); });
  });
}

/* 取り込み直すのは手間なので、消したあとしばらく戻せるようにしておく。 */
async function deleteTrack(id){
  let backup = null;
  try{ backup = await dbGet("tracks", id); }catch(e){}

  const memberships = S.playlists
    .filter(p => p.trackIds.includes(id))
    .map(p => ({ id: p.id, index: p.trackIds.indexOf(id) }));

  if(S.currentId === id){
    audio.pause();
    audio.removeAttribute("src");
    S.currentId = null;
    $("mini").classList.remove("show");
  }
  if(prefetched.id === id) prefetched = { id: null, blob: null };

  await dbDel("tracks", id);
  S.tracks = S.tracks.filter(x => x.id !== id);
  for(const p of S.playlists){
    if(p.trackIds.includes(id)){
      p.trackIds = p.trackIds.filter(x => x !== id);
      await dbPut("playlists", p);
    }
  }
  S.queue = S.queue.filter(x => x !== id);
  render();

  if(!backup){ toast("削除しました"); return; }
  toast("「" + backup.title + "」を削除しました", {
    label: "元に戻す",
    run: async () => {
      try{
        await dbPut("tracks", backup);
        const { blob, ...meta } = backup;
        S.tracks.push(meta);
        for(const m of memberships){
          const p = S.playlists.find(x => x.id === m.id);
          if(p){
            p.trackIds.splice(Math.min(m.index, p.trackIds.length), 0, id);
            await dbPut("playlists", p);
          }
        }
        render();
        toast("元に戻しました");
      }catch(e){
        toast("戻せませんでした（保存容量が不足している可能性）");
      }
    }
  });
}

/* ---------- 設定 ---------- */
async function renderSettings(){
  $("eyebrow").textContent = "Settings";
  $("pageTitle").textContent = "設定";
  const totalBytes = S.tracks.reduce((s, t) => s + (t.fileSize || 0), 0);

  let quotaLine = "この端末では取得できません";
  let pct = 0;
  try{
    if(navigator.storage && navigator.storage.estimate){
      const e = await navigator.storage.estimate();
      if(e.quota){
        pct = Math.min(100, (e.usage / e.quota) * 100);
        quotaLine = fmtBytes(e.usage) + " / " + fmtBytes(e.quota) + " 使用";
      }
    }
  }catch(e){}

  const standalone = window.navigator.standalone === true ||
                     window.matchMedia("(display-mode: standalone)").matches;

  $("main").innerHTML = `
    <div class="card">
      <h3>保存容量</h3>
      <div class="gauge"><i style="width:${pct.toFixed(1)}%"></i></div>
      <div class="stat"><span>曲数</span><b>${S.tracks.length}</b></div>
      <div class="stat"><span>音楽データ</span><b>${fmtBytes(totalBytes)}</b></div>
      <div class="stat"><span>ブラウザ割当</span><b>${quotaLine}</b></div>
    </div>

    ${S.importError ? `
    <div class="card" style="border-color:rgba(255,107,107,.45)">
      <h3 style="color:var(--danger)">保存の上限に達した記録</h3>
      <div class="stat"><span>止まった日時</span><b>${fmtDate(S.importError.at)}</b></div>
      <div class="stat"><span>そのときの曲数</span><b>${S.importError.tracksAtFailure}</b></div>
      <div class="stat"><span>そのときのデータ量</span><b>${fmtBytes(S.importError.bytesAtFailure)}</b></div>
      <p style="margin-top:10px">止まったファイル：${esc(S.importError.fileName)}</p>
      <button class="linkbtn" id="clearImpErr" style="margin:12px 0 0">この記録を消す</button>
    </div>` : ""}

    <div class="card">
      <h3>動作チェック</h3>
      <div class="stat"><span>ホーム画面から起動</span><b style="color:${standalone ? "var(--green)" : "var(--danger)"}">${standalone ? "はい" : "いいえ"}</b></div>
      <div class="stat"><span>オフライン対応</span><b style="color:${"serviceWorker" in navigator ? "var(--green)" : "var(--danger)"}">${"serviceWorker" in navigator ? "有効" : "非対応"}</b></div>
      <div class="stat"><span>ロック画面操作</span><b style="color:${"mediaSession" in navigator ? "var(--green)" : "var(--danger)"}">${"mediaSession" in navigator ? "対応" : "非対応"}</b></div>
      <div class="stat"><span>データの自動削除よけ</span><b style="color:${S.persisted ? "var(--green)" : "var(--muted)"}">${S.persisted ? "有効" : "この端末では不可"}</b></div>
      <p style="margin-top:12px">曲を再生したまま電源ボタンで画面を消し、音が鳴り続けるか確かめてください。止まる場合はロック画面での再生に制限があります。</p>
      <p style="margin-top:8px">「自動削除よけ」が不可の場合（iPhoneはこちら）、長く使わないとデータが消えることがあります。ホーム画面のアイコンから定期的に開くのが唯一の対策です。</p>
    </div>

    <button class="linkbtn" id="btnExport">プレイリスト構成を書き出す</button>
    <button class="linkbtn" id="btnImportPl">プレイリスト構成を読み込む</button>
    <button class="linkbtn danger" id="btnReset">すべてのデータを削除</button>

    <div class="card" style="margin-top:14px">
      <h3>Prism について</h3>
      <p>個人利用のための音楽プレイヤーです。曲はこの端末の中だけに保存され、外部に送信されることはありません。</p>
    </div>`;

  $("btnExport").addEventListener("click", exportPlaylists);
  $("btnImportPl").addEventListener("click", () => $("plImport").click());
  $("btnReset").addEventListener("click", confirmReset);
  const ci = $("clearImpErr");
  if(ci) ci.addEventListener("click", async () => {
    S.importError = null;
    await saveSettings();
    render();
  });
}

function exportPlaylists(){
  const data = {
    version: 1, exportedAt: new Date().toISOString(),
    tracks: S.tracks.map(t => ({ id: t.id, title: t.title, artist: t.artist, fileName: t.fileName, fileSize: t.fileSize })),
    playlists: S.playlists
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "prism-backup.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("書き出しました");
}

function confirmReset(){
  openSheet(`
    <h3>すべてのデータを削除</h3>
    <p class="sub">曲・プレイリストがすべて消えます。取り消せません。</p>
    <button class="sheet-item danger" id="okReset">削除する</button>
    <button class="sheet-item" id="noReset">やめる</button>`);
  $("noReset").addEventListener("click", closeSheet);
  $("okReset").addEventListener("click", async () => {
    audio.pause(); audio.removeAttribute("src");
    await req(tx("tracks", "readwrite").clear());
    await req(tx("playlists", "readwrite").clear());
    await req(tx("settings", "readwrite").clear());
    S.tracks = []; S.playlists = []; S.currentId = null; S.queue = []; S.order = [];
    S.source = {type:"library"}; S.importError = null;
    prefetched = { id: null, blob: null };
    artCache.clear();
    $("mini").classList.remove("show");
    closeSheet(); render(); toast("削除しました");
  });
}

/* ============================================================
   10. シート / Now Playing
   ============================================================ */
function openSheet(html){

  $("sheet").classList.add("show");
  $("scrim").classList.add("show");
}
function closeSheet(){
  $("sheet").classList.remove("show");

}

function openNP(){ if(S.currentId) $("np").classList.add("show"); }

$("miniOpen").addEventListener("click", openNP);

/* Now Playingを下スワイプで閉じる。
   ただしシークバーや再生ボタンから始まった指の動きは対象外にする。
   つまんだ指が下に流れただけで画面が閉じてしまうため。 */
let touchY0 = null;
$("np").addEventListener("touchstart", e => {
  touchY0 = e.target.closest(".seek, .transport") ? null : e.touches[0].clientY;
}, {passive:true});
$("np").addEventListener("touchend", e => {
  if(touchY0 !== null && e.changedTouches[0].clientY - touchY0 > 90) closeNP();
  touchY0 = null;
}, {passive:true});

/* 画面の左端から右へ払うと、プレイリストの中から一覧へ戻る */
let edgeX = null;
document.addEventListener("touchstart", e => {
  const t = e.touches[0];
  edgeX = (t.clientX < 26 && !$("np").classList.contains("show")) ? t.clientX : null;
}, {passive:true});
document.addEventListener("touchend", e => {
  if(edgeX === null) return;
  const dx = e.changedTouches[0].clientX - edgeX;
  edgeX = null;
  if(dx > 70 && S.view === "playlists" && S.activePlaylistId){
    S.activePlaylistId = null;
    render();
  }
}, {passive:true});

$("busyCancel").addEventListener("click", () => { if(busyCancel) busyCancel(); });

$("btnPlay").addEventListener("click", togglePlay);
$("miniPlay").addEventListener("click", togglePlay);

$("miniNext").addEventListener("click", () => nextTrack(true));

$("btnRepeat").addEventListener("click", () => {

}

document.querySelectorAll("#tabs button").forEach(b =>
  b.addEventListener("click", () => {

    S.view = b.dataset.view;
    if(b.dataset.view !== "playlists") S.activePlaylistId = null;

  }));

$("filePicker").addEventListener("change", e => { importFiles(e.target.files); e.target.value = ""; });

/* プレイリスト構成の読み込み用 */
const plImport = document.createElement("input");
plImport.type = "file"; plImport.accept = "application/json,.json"; plImport.id = "plImport";
plImport.className = "hidden";
document.body.appendChild(plImport);
plImport.addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    if(!Array.isArray(data.playlists)) throw 0;
    // ファイル名を手がかりに、いまライブラリにある曲へ結び直す
    const byFile = new Map(S.tracks.map(t => [t.fileName, t.id]));
    const oldById = new Map((data.tracks || []).map(t => [t.id, t]));
    let restored = 0;
    for(const p of data.playlists){
      const ids = (p.trackIds || []).map(oid => {
        const old = oldById.get(oid);
        return old ? byFile.get(old.fileName) : null;
      }).filter(Boolean);
      const np = { id: uid(), name: p.name, trackIds: ids, createdAt: Date.now(), updatedAt: Date.now() };
      await dbPut("playlists", np);
      S.playlists.push(np);
      restored++;
    }
    render();
    toast(restored + "件のプレイリストを復元しました");
  }catch(err){
    toast("読み込めませんでした");
  }
});

/* ============================================================
   11-b. iOSの音声ロック解除
   iOSは「ユーザーが触った瞬間」以外の再生開始を拒否する。
   曲の読み込みはファイル取り出しを挟むため、その瞬間から少しずれる。
   そこで最初のタップで無音を一度鳴らし、以降の再生を許可させておく。
   ============================================================ */
const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  if(audio.currentSrc || audio.src) return;   // すでに曲が入っていれば不要
  try{
    audio.src = SILENT;
    const p = audio.play();
    if(p && p.then) p.then(() => {
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      setPlayingUI(false);
    }).catch(() => {});
  }catch(e){}
}
document.addEventListener("touchend", unlockAudio, {capture:true, once:true, passive:true});
document.addEventListener("click",    unlockAudio, {capture:true, once:true});

/* ============================================================
   12. 起動
   ============================================================ */
(async function init(){
  try{
    db = await openDB();
  }catch(e){
    document.getElementById("main").innerHTML =
      '<div class="empty"><h2>データベースを開けません</h2><p>Safariのプライベートブラウズを解除して開き直してください。</p></div>';
    return;
  }

  // 保存領域を消されにくくする（対応ブラウザのみ。iOSは対応していない）
  try{
    if(navigator.storage && navigator.storage.persist) S.persisted = await navigator.storage.persist();
  }catch(e){}

  const [tracks, playlists, cfg] = await Promise.all([
    dbAll("tracks"), dbAll("playlists"), dbGet("settings", "app")
  ]);
  S.tracks = tracks.map(({ blob, ...m }) => m);
  S.playlists = playlists;

  if(cfg){
    S.repeat  = cfg.repeat  || "off";
    S.shuffle = !!cfg.shuffle;
    S.sort    = cfg.sort    || "addedAt";
    S.source  = cfg.source  || {type:"library"};
    S.importError = cfg.importError || null;
  }
  $("btnShuffle").setAttribute("aria-pressed", S.shuffle);
  applyRepeatUI();
  render();

  // 前回の続きを復元（自動再生はしない。iOSは操作なしの再生を認めないため）
  if(cfg && cfg.lastTrackId && trackById(cfg.lastTrackId)){
    S.queue = queueFromSource(S.source, cfg.lastTrackId);
    if(S.queue.length){
      buildOrder(cfg.lastTrackId);
      await loadCurrent(false, cfg.lastPos || 0);
    }
  }

  if("serviceWorker" in navigator){
    try{
      const reg = await navigator.serviceWorker.register("sw.js");
      // アプリを更新したとき、開きっぱなしでも気づけるようにする
      reg.addEventListener("updatefound", () => {
        const sw = reg.installing;
        if(!sw) return;
        sw.addEventListener("statechange", () => {
          if(sw.state === "installed" && navigator.serviceWorker.controller){
            toast("新しいバージョンがあります", { label:"更新する", run: () => location.reload() });
          }
        });
      });
    }catch(e){}
  }
})();

window.addEventListener("pagehide", () => saveSettings());
document.addEventListener("visibilitychange", () => { if(document.hidden) saveSettings(); });
</script>
